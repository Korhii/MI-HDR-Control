<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-label="从连接到恢复 / Connect → restore">
<rect width="1120" height="380" rx="24" fill="#10161d"/>
<style>text{font-family:Segoe UI,Microsoft YaHei,sans-serif} .t{fill:#eaf0f5;font-size:22px;font-weight:600}.s{fill:#a8bac9;font-size:16px}.b{fill:#d9e6ef;font-size:18px}.f{fill:#b5c8d8;font-size:15px}</style>
<text x="40" y="48" class="t">从连接到恢复 / Connect → restore</text><text x="40" y="78" class="s">先读回与备份，再进行短时调节 / Read and back up before tuning</text>
<rect x="40" y="120" width="240" height="166" rx="14" fill="#1a2632" stroke="#42657d"/>
<text x="58" y="153" class="t">01 连接 / Connect</text>
<text x="58" y="188" class="b">开启 ADB · 完成授权</text>
<text x="58" y="215" class="b">Select verified model</text>
<path d="M 287 203 h 17 m -7 -7 l 7 7 -7 7" stroke="#6dcab2" stroke-width="2.5" fill="none"/>
<rect x="312" y="120" width="240" height="166" rx="14" fill="#1a2632" stroke="#42657d"/>
<text x="330" y="153" class="t">02 准备 / Prepare</text>
<text x="330" y="188" class="b">电脑备份 · 本机生成</text>
<text x="330" y="215" class="b">Backup + local cache</text>
<path d="M 559 203 h 17 m -7 -7 l 7 7 -7 7" stroke="#6dcab2" stroke-width="2.5" fill="none"/>
<rect x="584" y="120" width="240" height="166" rx="14" fill="#1a2632" stroke="#42657d"/>
<text x="602" y="153" class="t">03 调节 / Tune</text>
<text x="602" y="188" class="b">小步修改 · 检查回执</text>
<text x="602" y="215" class="b">Small steps + readback</text>
<path d="M 831 203 h 17 m -7 -7 l 7 7 -7 7" stroke="#6dcab2" stroke-width="2.5" fill="none"/>
<rect x="856" y="120" width="240" height="166" rx="14" fill="#1a2632" stroke="#42657d"/>
<text x="874" y="153" class="t">04 恢复 / Restore</text>
<text x="874" y="188" class="b">临时恢复 / 移除常驻</text>
<text x="874" y="215" class="b">Restore + verify</text>
<text x="40" y="338" class="f">关闭 PC 不会撤销显示器常驻方案 / Closing the PC does not cancel monitor-local persistence</text></svg>